[build]
  command = "nuxt generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Set VITE_API_BASE_URL to your Render backend URL in the Netlify dashboard.
# Example: VITE_API_BASE_URL=https://pcv-backend-xxxxx.onrender.com

# SPA redirects — all routes resolve to the single-page app
[[redirects]]
  from = "/*"
  to = "/200.html"
  status = 200
